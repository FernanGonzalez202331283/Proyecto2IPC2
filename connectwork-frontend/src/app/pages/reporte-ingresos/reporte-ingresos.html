<div class="reporte-container">

  <div class="overlay"></div>

  <div class="reporte-card">
    <div class="top-bar">
    <button class="btn-volver" (click)="regresar()">Regresar</button>
  </div>

    <div class="header">
      <h1>Reporte de Ingresos</h1>
      <p>Consulta los ingresos generados por la plataforma</p>
    </div>

    <div class="form-group">

      <div class="input-box">
        <label>Fecha Inicio</label>
        <input type="date" [(ngModel)]="fechaInicio">
      </div>

      <div class="input-box">
        <label>Fecha Fin</label>
        <input type="date" [(ngModel)]="fechaFin">
      </div>

    </div>

    <button class="btn-generar" (click)="cargar()">
      Generar Reporte
    </button>

    <button
  class="btn-pdf"
  (click)="exportarPDF()"
  *ngIf="totalContratos > 0">

  Exportar PDF

</button>

    <div class="resultados">

      <div class="resultado-card">
        <h3>Total Contratos</h3>
        <span>{{ totalContratos }}</span>
      </div>

      <div class="resultado-card">
        <h3>Total Comisiones</h3>
        <span>Q{{ totalComisiones }}</span>
      </div>

    </div>

  </div>

</div>
