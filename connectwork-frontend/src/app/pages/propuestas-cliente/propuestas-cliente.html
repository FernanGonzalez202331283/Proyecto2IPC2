<div class="page">

  <button class="btn-back" (click)="volver()">
    ← Volver
  </button>

  <h2 class="title">Propuestas recibidas</h2>

  <div *ngIf="propuestas.length === 0" class="empty">
    No hay propuestas aún
  </div>

  <div *ngFor="let p of propuestas" class="card">

    <!-- HEADER -->
    <div class="card-header">
      <div>
        <h3>{{ p.proyectoTitulo }}</h3>
        <small>Freelancer #{{ p.freelancerId }}</small>
      </div>

      <!-- protegido contra null -->
      <span class="estado" [ngClass]="p.estado?.toLowerCase()">
        {{ p.estado }}
      </span>
    </div>

    <!-- INFO -->
    <div class="info">
      <p><b>Monto ofertado:</b> Q{{ p.monto }}</p>
      <p><b>Tiempo de entrega:</b> {{ p.tiempo }} días</p>
      <p><b>Descripción:</b> {{ p.descripcion }}</p>
    </div>

   <div class="acciones">

  <!-- SELECCIONAR -->
  <button 
  class="btn-aceptar" 
  (click)="seleccionar(p.id)"
  [disabled]="p.estado !== 'EN_REVISION'">
  Seleccionar
</button>

  <button 
  (click)="confirmar(p.id)"
  [disabled]="p.estado?.toUpperCase() !== 'SELECCIONADA'">
  Confirmar
</button>

  <!-- RECHAZAR -->
  <button 
    class="btn-rechazar" 
    (click)="rechazar(p.id)"
    [disabled]="p.estado?.toUpperCase() !== 'EN_REVISION'">
    Rechazar
  </button>


    </div>

  </div>

</div>
