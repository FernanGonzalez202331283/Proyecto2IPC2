<div class="background">

   <button class="btn-back" (click)="regresar()">
    ← Volver al login
  </button>
  <div class="card">
    <h2>Completa tu perfil</h2>
    <p class="subtitle">Agrega información para continuar</p>

    <form (ngSubmit)="guardar()">

      <label>Descripción</label>
      <textarea [(ngModel)]="descripcion" name="descripcion" required></textarea>

      <label>Sector</label>
      <input [(ngModel)]="sector" name="sector" required />

      <label>Sitio web (opcional)</label>
      <input [(ngModel)]="sitioWeb" name="sitioWeb" />

      <button type="submit">Guardar</button>

    </form>
  </div>
</div>
