<div class="container">

  <!-- HEADER -->
  <div class="top-bar">
    <button class="btn-back" (click)="regresar()">Regresar</button>
    <h2>Explorar Proyectos</h2>
  </div>

  <!-- FILTROS -->
  <div class="filtros">

    <!-- CATEGORÍA -->
    <select [(ngModel)]="categoriaSeleccionada" (change)="filtrar()">
      <option [ngValue]="null">Todas las categorías</option>
      <option *ngFor="let c of categorias" [ngValue]="c.id">
        {{ c.nombre }}
      </option>
    </select>

    <!-- HABILIDADES -->
    <select [(ngModel)]="habilidadSeleccionada" (change)="filtrar()">
      <option [ngValue]="null">Todas las habilidades</option>
      <option *ngFor="let h of habilidades" [ngValue]="h.id">
        {{ h.nombre }}
      </option>
    </select>

    <!-- PRESUPUESTO -->
    <input 
      type="number" 
      placeholder="Min Q" 
      [(ngModel)]="presupuestoMin" 
      (input)="filtrar()"
    >

    <input 
      type="number" 
      placeholder="Max Q" 
      [(ngModel)]="presupuestoMax" 
      (input)="filtrar()"
    >

    <!-- LIMPIAR -->
    <button class="btn-limpiar" (click)="limpiarFiltros()">
      Limpiar
    </button>

  </div>

  <!-- SIN RESULTADOS -->
  <div *ngIf="proyectos.length === 0" class="empty">
    <p>No hay proyectos disponibles</p>
  </div>

  <!-- GRID -->
  <div class="grid">

    <div *ngFor="let p of proyectos" class="card">

      <div class="card-header">
        <h3>{{ p.titulo }}</h3>
        <span class="categoria">{{ p.categoria }}</span>
      </div>

      <p class="desc">{{ p.descripcion }}</p>
      <div class="habilidades" *ngIf="p.habilidades?.length">
        <span *ngFor="let h of p.habilidades" class="tag">
          {{ h.nombre }}
        </span>
      </div>

      <div class="info">
        <span class="precio">Q{{ p.presupuesto }}</span>
      </div>

      <button class="btn-detalle" (click)="verDetalle(p.id)">
        Ver detalle
      </button>

    </div>

  </div>

</div>
