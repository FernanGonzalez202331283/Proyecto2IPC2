<div class="register-container">

  <div class="register-card">
    <h2>Crear cuenta</h2>
    <p class="subtitle">Completa tus datos para registrarte</p>

    <form (ngSubmit)="registrar()">

      <div class="form-grid">

        <input [(ngModel)]="nombre" name="nombre" placeholder="Nombre completo" required>
        <input [(ngModel)]="username" name="username" placeholder="Usuario" required>

        <input [(ngModel)]="correo" name="correo" type="email" placeholder="Correo" required>
        <input [(ngModel)]="telefono" name="telefono" placeholder="Teléfono" required>

        <input [(ngModel)]="direccion" name="direccion" placeholder="Dirección" required>
        <input [(ngModel)]="cui" name="cui" placeholder="CUI" required>

        <input [(ngModel)]="fechaNacimiento" name="fechaNacimiento" type="date" required>
        <select [(ngModel)]="rol" name="rol" required>
          <option value="">Seleccione tipo</option>
          <option value="CLIENTE">Cliente</option>
          <option value="FREELANCER">Freelancer</option>
          <option value="ADMIN">Administrador</option>
        </select>

        <input class="full-width" [(ngModel)]="password" name="password" type="password" placeholder="Contraseña" required>

      </div>

      <button type="submit">Registrarse</button>

    </form>

  </div>

</div>
