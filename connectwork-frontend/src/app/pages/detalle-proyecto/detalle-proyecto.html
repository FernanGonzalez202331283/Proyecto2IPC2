<div class="detalle-container">

  <!-- BOTÓN REGRESAR -->
  <button class="btn-back" (click)="regresar()">← Regresar</button>

  <!-- TÍTULO PRINCIPAL -->
  <h2 class="titulo-pagina">Detalle del Proyecto</h2>

  <div *ngIf="proyecto != null" class="card">

    <div class="header">
      <h1>{{ proyecto.titulo }}</h1>
      <span class="badge">{{ proyecto.categoria }}</span>
    </div>

    <p class="descripcion">
      {{ proyecto.descripcion }}
    </p>

    <div class="info">
      <div class="item">
        <span class="label">Presupuesto</span>
        <span class="value">Q{{ proyecto.presupuesto }}</span>
      </div>
    </div>

    <button class="btn-propuesta">
      Enviar propuesta
    </button>

  </div>

</div>
