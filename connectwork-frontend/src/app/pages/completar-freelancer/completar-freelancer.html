<div class="background">

  <!-- BOTÓN REGRESAR -->
  <button class="btn-back" (click)="regresar()">
    Volver al login
  </button>

  <div class="card">

    <h2>Completar Perfil Freelancer</h2>
    <p class="subtitle">Agrega tu información profesional</p>

    <form (ngSubmit)="guardar()">

      <label>Biografía</label>
      <textarea [(ngModel)]="biografia" name="biografia" required></textarea>

      <label>Nivel de Experiencia</label>
      <select [(ngModel)]="nivelExperiencia" name="nivelExperiencia" required>
        <option value="">Seleccione</option>
        <option value="JUNIOR">Junior</option>
        <option value="SEMI">Semi-Senior</option>
        <option value="SENIOR">Senior</option>
      </select>

      <label>Tarifa por hora (Q)</label>
      <input type="number" [(ngModel)]="tarifaHora" name="tarifaHora" required>

      <label>Habilidades</label>
      <div class="habilidades">
        <label *ngFor="let h of listaHabilidades" class="habilidad-item">
          <input 
            type="checkbox"
            [checked]="habilidades.includes(h.id)"
            (change)="toggleHabilidad(h.id)">
          {{ h.nombre }}
        </label>
      </div>

      <button type="submit" class="btn-guardar">
        Guardar
      </button>

    </form>

  </div>

</div>
